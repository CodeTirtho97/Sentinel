global:
  # sentinel.metrics.scrape-interval must match this: it converts a sample count into coverage.
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: demo-fleet
    metrics_path: /actuator/prometheus
    static_configs:
      # Order path
      - targets:
          - api-gateway:8080
          - checkout-service:8080
          - cart-service:8080
          - payment-service:8080
          - fraud-service:8080
          - ledger-service:8080
      # Browse path — disconnected from the order path on purpose
      - targets:
          - search-service:8080
          - catalog-service:8080

  # Sentinel is both the consumer and a subject of these metrics.
  - job_name: sentinel
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - sentinel:8080

{{/*
Redis holds the correlation window and the dedupe keys — a hot set that expires by TTL. Losing it on
restart costs at most one correlation window, and the partial unique index still prevents the
duplicate incidents a lost dedupe key would otherwise allow. So: no PVC and no persistence, stated
deliberately rather than left as an omission someone has to notice.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentinel.fullname" . }}-redis
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "sentinel.selectorLabels" (dict "root" $ "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sentinel.podLabels" (dict "root" $ "component" "redis") | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            failureThreshold: 12
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinel.fullname" . }}-redis
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "sentinel.selectorLabels" (dict "root" $ "component" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentinel.fullname" . }}-grafana
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "sentinel.selectorLabels" (dict "root" $ "component" "grafana") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sentinel.podLabels" (dict "root" $ "component" "grafana") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/grafana-config.yaml") . | sha256sum }}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_USERS_DEFAULT_THEME
              value: dark
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
      volumes:
        - name: datasources
          configMap:
            name: {{ include "sentinel.fullname" . }}-grafana-provisioning
            items:
              - key: datasources.yaml
                path: datasources.yaml
        # The provider yaml and the dashboard JSON have to land in the same directory — Grafana
        # reads providers from this path and the provider's own options.path points back at it,
        # which is how the Compose layout works. Two ConfigMaps cannot both mount at one path, so
        # they are projected into a single volume instead of nesting mounts.
        - name: dashboards
          projected:
            sources:
              - configMap:
                  name: {{ include "sentinel.fullname" . }}-grafana-provisioning
                  items:
                    - key: dashboards.yaml
                      path: dashboards.yaml
              - configMap:
                  name: {{ include "sentinel.fullname" . }}-grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinel.fullname" . }}-grafana
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
spec:
  type: {{ .Values.grafana.service.type }}
  selector:
    {{- include "sentinel.selectorLabels" (dict "root" $ "component" "grafana") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.grafana.service.port }}
      targetPort: http
      {{- if eq .Values.grafana.service.type "NodePort" }}
      nodePort: {{ .Values.grafana.service.nodePort }}
      {{- end }}

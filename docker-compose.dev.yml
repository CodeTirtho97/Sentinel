# Dev overlay for working on the demo page.
#
# The problem it solves: static/demo.html is baked into the jar at build time, so editing the
# source file changes nothing in a running container — you get the version that was compiled,
# and the only way forward is a full Maven rebuild for a CSS tweak.
#
# This mounts the source directory over a path inside the container and puts it FIRST in
# static-locations, so Spring serves the file on disk and a browser refresh is the whole loop.
# Nothing else changes: same image, same profile, same ports, same everything on the network.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d sentinel
#
# or just `make ui`. Drop the overlay (plain `make demo`) to go back to the packaged copy —
# which you should do before recording anything, so what you record is what actually ships.

services:
  sentinel:
    volumes:
      - ./sentinel-platform/src/main/resources/static:/app/static:ro
    environment:
      # file: wins over classpath:, so the mounted copy shadows the packaged one. The trailing
      # slashes are required — Spring treats a location without one as a file, not a directory.
      SPRING_WEB_RESOURCES_STATIC_LOCATIONS: "file:/app/static/,classpath:/static/"
      # Otherwise the browser is told to cache it and your edit is invisible behind a 304.
      SPRING_WEB_RESOURCES_CACHE_PERIOD: "0"
      SPRING_WEB_RESOURCES_CHAIN_CACHE: "false"
